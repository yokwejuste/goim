    <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
    <title>{{ customer.name }}</title>
</head>

<div class="limiter">
    <div class="container-login100">
        <div class="wrap-login100 p-t-85 p-b-20">
            <form class="login100-form validate-form"
                  action="{% url 'customer_status' pk=customer.id %}" method="post">
                {% csrf_token %}
                <span class="login100-form-avatar">
						<a href="{{ customer.photo.url }}">
                            <img src="{{ customer.photo.url }}" alt="AVATAR">
                        </a>
					</span>

                <div class="block">
                    <span class="text-gray-700">Steps</span>
                    <div class="mt-2">
                        <div class="my-2">
                            <label class="inline-flex items-center">
                                {{ form.local_archive }}
                                <span class="ml-2">{{ form.local_archive.label }}</span>
                            </label>
                        </div>
                        <div class="my-2">
                            <label class="inline-flex items-center">
                                {{ form.scanned_documents }}
                                <span class="ml-2">{{ form.scanned_documents.label }}</span>
                            </label>
                        </div>
                        <div class="my-2">
                            <label class="inline-flex items-center">
                                {{ form.visa }}
                                <span class="ml-2">{{ form.visa.label }}</span>
                            </label>
                        </div>
                        <div class="my-2">
                            <label class="inline-flex items-center">
                                {{ form.passport }}
                                <span class="ml-2">{{ form.passport.label }}</span>
                            </label>
                        </div>
                        <div class="my-2">
                            <label class="inline-flex items-center">
                                {{ form.gone_complete }}
                                <span class="ml-2">{{ form.gone_complete.label }}</span>
                            </label>
                        </div>
                    </div>
                </div>
                <div>
                <span class="container-login100-form-btn w-50 float-left">
                    <a href="#" class="login100-form-btn bg-blue-700">
                        Change
                    </a>
                </span>
                    <span class="container-login100-form-btn w-50">
                    <a href="#" class="login100-form-btn">
                        Ok
                    </a>
                </span>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
