{% extends 'base.html' %}

{% block title %}
    Event
{% endblock %}

{% block content %}
    <div class="clearfix">
        <a class="btn btn-info left" href="{% url 'calendar' %}"> Calendar </a>
    </div>

    <form method="post">
        {% csrf_token %}
        <table class="form form-table">
            {{ form }}
            <tr>
                <td colspan="2">
                    <button type="submit" class="btn btn-info right"> Submit</button>
                    <a href="{% url 'preview' %}" class="btn btn-info right">To Records</a>
                </td>
            </tr>
        </table>
    </form>
    <script>
        CKEDITOR.replace('description');
    </script>
{% endblock %}
