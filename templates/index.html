<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <script src="//cdn.pushbots.com/js/sdk.min.js" type="text/javascript" onload="PB.init()" async></script>
    <link href="https://unpkg.com/tailwindcss@^1.0/dist/tailwind.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="{% static 'img/favicon.ico' %}"/>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
    <meta charset="UTF-8">
    <style>
        .loader {
            border: 16px solid #f3f3f3;
            border-radius: 50%;
            border-top: 16px solid blue;
            border-right: 16px solid green;
            border-bottom: 16px solid red;
            width: 120px;
            height: 120px;
            -webkit-animation: spin 2s linear infinite;
            animation: spin 2s linear infinite;
        }

        @-webkit-keyframes spin {
            0% {
                -webkit-transform: rotate(0deg);
            }
            100% {
                -webkit-transform: rotate(360deg);
            }
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <title>Home</title>
</head>
<body onload="myFunction()" class="flex justify-center items-center bg-gray-900 h-screen" style="margin: 0;">
<div id="loader" class="flex space-x-2 p-40 rounded-full justify-center items-center">
    <div class="middle">
        <div class="loader"></div>
    </div>
</div>

<main style="display: none;" id="myDiv">

    <section class="bg-gray-300 py-20 lg:py-28 sm:rounded-xl">
        <div class="container mx-auto px-5">
            <div class="grid lg:grid-cols-2 gap-10 items-center text-center lg:text-left">
                <div class="space-y-8">
                    <div class="space-y-4">
                        <h2 class="text-3xl sm:text-5xl font-bold">Go Immigration</h2>
                        <p class="text-xl text-gray-600">A Better View for Emigration in Africa</p>
                    </div>
                    <div class="flex justify-center lg:justify-start items-center space-x-4">
                        <a href="{% url 'login' %}"
                           class="inline-block rounded-full px-6
                           py-3 bg-white hover:bg-blue-900 text-blue-800
                            hover:text-white shadow transition
                             duration-300 hover:shadow-lg
                             text-lg font-semibold">Login</a>
                        <a href="{% url 'register' %}"
                           class="inline-block rounded-full px-6
                           py-3 bg-white hover:bg-red-800 text-red-800
                            hover:text-white shadow transition
                             duration-300 hover:shadow-lg
                             text-lg font-semibold">Register</a>
                    </div>
                </div>
                <div>
                    <img class="rounded-full" src="{% static 'img/logo.png' %}" alt="Drone">
                </div>
            </div>
        </div>
    </section>
</main>

<div style="display:none;" id="myDiv">
    <img class="align-self-center border-red-700" src="{% static 'img/logo.png' %}" alt="">
</div>

<script>
    var myVar;

    function myFunction() {
        myVar = setTimeout(showPage, 4000);
    }

    function showPage() {
        document.getElementById("loader").style.display = "none";
        document.getElementById("myDiv").style.display = "block";
    }
</script>
<script async defer src="https://scripts.simpleanalyticscdn.com/latest.js"></script>
<noscript><img src="https://queue.simpleanalyticscdn.com/noscript.gif" alt=""
               referrerpolicy="no-referrer-when-downgrade"/></noscript>
</body>
</html>
