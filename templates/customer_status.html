<!doctype html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width,
          user-scalable=no, initial-scale=1.0,
          maximum-scale=1.0, minimum-scale=1.0"
    >
    <!--===============================================================================================-->
    <link rel="icon" type="image/png" href="{% static 'img/favicon.ico' %}"/>
    <!--===============================================================================================-->
    <link rel="stylesheet" type="text/css" href="{% static 'bootstrap/css/bootstrap.min.css' %}">
    <!--===============================================================================================-->
    <link rel="stylesheet" type="text/css" href="{% static 'new/fonts/font-awesome-4.7.0/css/font-awesome.min.css' %}">
    <!--===============================================================================================-->
    <link rel="stylesheet" type="text/css"
          href="{% static 'new/fonts/iconic/css/material-design-iconic-font.min.css' %}">
    <!--===============================================================================================-->
    <link rel="stylesheet" type="text/css" href="{% static 'new/vendor/animate/animate.css' %}">
    <!--===============================================================================================-->
    <link rel="stylesheet" type="text/css" href="{% static 'new/vendor/css-hamburgers/hamburgers.min.css' %}">
    <!--===============================================================================================-->
    <link rel="stylesheet" type="text/css" href="{% static 'new/vendor/animsition/css/animsition.min.css' %}">
    <!--===============================================================================================-->
    <link rel="stylesheet" type="text/css" href="{% static 'new/vendor/select2/select2.min.css' %}">
    <!--===============================================================================================-->
    <link rel="stylesheet" type="text/css" href="{% static 'new/vendor/daterangepicker/daterangepicker.css' %}">
    <!--===============================================================================================-->
    <link rel="stylesheet" type="text/css" href="{% static 'new/css/util.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'new/css/main.css' %}">
    <!--===============================================================================================-->
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="https://cdn.jsdelivr.net/npm/@tailwindcss/custom-forms@0.2.1/dist/custom-forms.css"
          rel="stylesheet">
    <link href="https://unpkg.com/tailwindcss@^1.0/dist/tailwind.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
    <title>{{ customer.name }}</title>
</head>
<body>
<div class="limiter">
    <div class="container-login100">
        <div class="wrap-login100 p-t-85 p-b-20">
            <form class="login100-form validate-form"
                  action="{% url "customer_status" pk=client.name.id %}"
                  method="post">
                {% csrf_token %}
                <span class="login100-form-avatar">
						<a href="{{ customer.photo.url }}">
                            <img src="{{ customer.photo.url }}" alt="AVATAR">
                        </a>
					</span>

                <div class="block">
                    <span class="text-gray-700">Steps</span>
                    <div class="mt-2">
                        <div class="my-2">
                            <label class="inline-flex items-center">
                                {{ status_form.name.label }}
                            </label>
                            {{ customer.name }}
                        </div>
                        <div class="my-2">
                            <label class="inline-flex items-center">
                                {{ status_form.value.label }}
                            </label>
                            {{ status_form.value }}
                        </div>
                        <div>
                    <span class="container-login100-form-btn w-50 float-left">
                        <a href="{% url 'customer_detail' pk=customer.id %}"
                           class="login100-form-btn bg-blue-500">
                            Back
                        </a>
                    </span>
                            <span class="container-login100-form-btn w-50 float-left">
                        <button class="login100-form-btn" type="submit">
                            Submit Changes
                        </button>
                    </span>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
