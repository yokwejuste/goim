{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Dashboard - {{ request.user.username }}</title>
    <link rel="stylesheet" href="{% static 'bootstrap/css/bootstrap.min.css' %}">
    <link rel="icon" type="image/png" href="{% static 'img/favicon.ico' %}"/>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i">
    <link rel="stylesheet" href="{% static 'fonts/fontawesome-all.min.css' %}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/@tailwindcss/custom-forms@0.2.1/dist/custom-forms.css"
          rel="stylesheet">
    <link href="https://unpkg.com/tailwindcss@^1.0/dist/tailwind.min.css"
          rel="stylesheet">
</head>

<body id="page-top">
<div id="wrapper">
    <div class="d-flex flex-column" id="content-wrapper">
        <div id="content">
            <nav class="navbar navbar-light navbar-expand bg-white shadow mb-4 topbar static-top">
                <div class="container-fluid">
                    <ul class="navbar-nav flex-nowrap ms-auto">
                        <li class="nav-item dropdown no-arrow mx-1"></li>
                        <li class="nav-item dropdown no-arrow mx-1">
                            <div class="shadow dropdown-list dropdown-menu dropdown-menu-end"
                                 aria-labelledby="alertsDropdown"></div>
                        </li>
                        <li class="nav-item dropdown no-arrow">
                            <div class="nav-item dropdown no-arrow">
                                <a class="dropdown-toggle nav-link"
                                   aria-expanded="false" data-bs-toggle="dropdown"
                                   href="#">
                                    <span
                                            class="d-none d-lg-inline me-2 text-gray-600 small">
                                        Hi {{ request.user.username }}&nbsp;!</span>
                                    <img alt=""
                                         class="border rounded-circle img-profile"
                                         src="{{ request.user.profile.url }}"></a>
                                <div class="dropdown-menu shadow dropdown-menu-end animated--grow-in"><a
                                        class="dropdown-item" href="{% url 'profile' %}"><i
                                        class="fas fa-user fa-sm fa-fw me-2 text-gray-400"></i>&nbsp;Profile</a><a
                                        class="dropdown-item" href="{% url 'choices' %}"><i
                                        class="fas fa-home fa-sm fa-fw me-2 text-gray-400"></i>&nbsp;Home</a><a
                                        class="dropdown-item" href="#"><i
                                        class="fas fa-list fa-sm fa-fw me-2 text-gray-400">
                                </i>&nbsp;Send Emails</a>
                                    <div class="dropdown-divider"></div>
                                    <a class="dropdown-item" href="{% url 'logout' %}"><i
                                            class="fas fa-sign-out-alt fa-sm fa-fw me-2 text-gray-400"></i>
                                        &nbsp;Logout</a>
                                </div>
                            </div>
                        </li>
                    </ul>
                </div>
            </nav>
            <div class="container-fluid">
                <div class="d-sm-flex justify-content-between align-items-center mb-4">
                    <a href="{% url 'dashboard' %}"><h3 class="text-dark mb-0">Dashboard</h3></a>
                    <a class="btn btn-warning sm d-none d-sm-inline-block hover:text-red-200"
                       role="button" href="{% url 'preview' %}"><i
                            class="fas fa-bars fa-sm text-white-50"></i>&nbsp;View Customers on list</a>
                    <a class="btn btn-primary btn-sm d-none d-sm-inline-block"
                       role="button" href="{% url 'choices' %}"><i
                            class="fas fa-plus-square fa-sm text-white-50"></i>&nbsp;Add a customer</a>
                </div>
                <div class="row">
                    <div class="col-lg-7 col-xl-8">
                        <div class="card shadow mb-4">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <h6 class="text-primary fw-bold m-0">Customers Variation</h6>
                            </div>
                            <div class="card-body">
                                <div class="chart-area">
                                    <canvas id="chart" style="width:70%;max-width:700px;height:70%;max-height:300px">
                                    </canvas>
                                    <script>
                                        var yValues =
                                        {{ arr }}
                                        var xValues = [
                                            'Jan', 'Feb', 'Mar',
                                            'Apr', 'May', 'Jun',
                                            'Jul', 'Aug', 'Sep',
                                            'Oct', 'Nov', 'Dec'
                                        ];
                                        new Chart("chart", {
                                            type: "line",
                                            data: {
                                                labels: xValues,
                                                datasets: [{
                                                    fill: true,
                                                    lineTension: 0,
                                                    backgroundColor: "rgba(121,189,175,0.44)",
                                                    borderColor: "rgba(0,0,255,0.1)",
                                                    data: yValues
                                                }]
                                            },
                                            options: {
                                                legend: {display: false},
                                                scales: {
                                                    yAxes: [{ticks: {min: 0, max: 30}}],
                                                }
                                            }
                                        });
                                    </script>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-5 col-xl-4">
                        <div class="card shadow mb-4">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <h6 class="text-primary fw-bold m-0">Customers Analysis</h6>
                            </div>
                            <script src="https://cdn.jsdelivr.net/npm/chart.js@2.9.3/dist/Chart.min.js"></script>
                            <div class="card-body">
                                <div class="chart-area">
                                    <canvas id="pie-chart" style="width:70%;
                                    max-width:700px;height:55%;max-height:300px"></canvas>
                                </div>
                                <script>

                                    var config = {
                                        type: 'doughnut',
                                        data: {
                                            datasets: [{
                                                data: {{ data|safe }},
                                                backgroundColor: [
                                                    '#ff0000', '#ceff00', '#9110fc'
                                                ],
                                                hoverOffset: 4
                                            }],
                                            labels: {{ labels|safe }}
                                        },
                                        options: {
                                            title: {
                                                display: true,
                                                text: 'Total Customers Submit'
                                            },
                                            plugins: {},
                                            responsive: true
                                        }
                                    };

                                    window.onload = function () {
                                        var ctx = document.getElementById('pie-chart').getContext('2d');
                                        window.myPie = new Chart(ctx, config);
                                    };

                                </script>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <footer class="bg-white sticky-footer">
            <div class="container my-auto">
                <div class="text-center my-auto copyright"><span>Copyright © Go Immigration <script>
                document.write(new Date().getFullYear());
            </script></span></div>
            </div>
        </footer>
    </div>
    <a class="border rounded d-inline scroll-to-top" href="#page-top"><i class="fas fa-angle-up"></i></a>
</div>
<script src="{% static 'bootstrap/js/bootstrap.min.js' %}"></script>
<script src="{% static 'js/chart.min.js' %}"></script>
<script src="{% static 'js/bs-init.js' %}"></script>
<script src="{% static 'js/theme.js' %}"></script>
</body>

</html>
